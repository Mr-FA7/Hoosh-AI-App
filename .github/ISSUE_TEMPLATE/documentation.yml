name: Documentation Issue
description: Report unclear or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve docs. **Do not include secrets.**
  - type: input
    id: affected
    attributes:
      label: Affected documentation
      description: File path or URL (e.g. README.md, docs/desktop-offline.md)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
