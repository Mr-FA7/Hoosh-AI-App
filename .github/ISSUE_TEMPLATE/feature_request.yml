name: Feature Request
description: Suggest an improvement to Hoosh AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposal clearly.

        **Do not include API keys, passwords, tokens, or other secrets.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Who benefits and how?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
