<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hoosh Local Bridge Settings</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Hoosh Local Bridge</h1>
  <p>This extension connects <a href="https://aihoosh.com/">aihoosh.com</a> to the Hoosh companion on your PC (port 3001).</p>
  <h2>Enable / disable</h2>
  <p>Use the toggle on <a id="extLink" href="#">chrome://extensions</a> or the switch in the extension popup menu.</p>
  <h2>Companion</h2>
  <p>Run the desktop shortcut <strong>Hoosh Local Bridge</strong> to start the companion service.</p>
</body>
<script>
  document.getElementById('extLink').href = 'chrome://extensions/?id=ompmlkjlllkclhbgjklenapfaacfhmjk';
