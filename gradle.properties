# FA7 Root Gradle Configuration
# Systemic fix for invalid Java home path reported in sub-projects.

# org.gradle.java.home specifies the path to the JDK to use for the build.
# AVOID hardcoding paths like /opt/homebrew/opt/openjdk@17 here.
# Instead, ensure your system's JAVA_HOME environment variable is set.
# Example: export JAVA_HOME=$(/usr/libexec/java_home -v 17)

# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
