# ComfyUI — FA7 Media Studio (GPU optional; CPU fallback slow)
services:
  comfyui:
    image: yanwk/comfyui-boot:cu124-slim
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui-models:/root/ComfyUI/models
      - ./comfyui-output:/root/ComfyUI/output
      - ./comfyui-input:/root/ComfyUI/input
    environment:
      CLI_ARGS: "--listen 0.0.0.0 --port 8188"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8188/system_stats"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
