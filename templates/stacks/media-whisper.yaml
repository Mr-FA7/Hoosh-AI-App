# Whisper ASR sidecar — FA7 Media Studio (original compose, uses upstream MIT image pattern)
services:
  whisper-api:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "9000:8000"
    environment:
      WHISPER__MODEL: Systran/faster-whisper-base
    volumes:
      - whisper-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  whisper-cache:
